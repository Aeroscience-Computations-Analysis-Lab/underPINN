name: Deploy Sphinx Docs to GitHub Pages

on:
  push:
    branches: ["main"]  

# Grants permissions to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt
          # Installs underPINN so Sphinx autodoc can import it and read the docstrings
          pip install -e . 
          
      - name: Build HTML
        run: |
          cd docs
          make html
          # Prevents GitHub Pages from breaking Sphinx CSS/images
          touch _build/html/.nojekyll 
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4