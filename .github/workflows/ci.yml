name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        # Pinned: an unpinned "pip install ruff" grabs whatever is newest at
        # CI run time, and ruff has changed its *default* enabled-rule set
        # between releases (0.15.x -> 0.16.0 alone went from ~60 to ~410
        # enabled rules) — that turns a routine dependency refresh into a
        # sudden, unrelated CI failure across the whole codebase. Bump this
        # deliberately, review the diff in enabled rules, and update
        # pyproject.toml's [tool.ruff.lint] select/ignore to match.
        run: python -m pip install ruff==0.15.15

      - name: Lint with Ruff
        run: ruff check underPINN/

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the package itself
          pip install -e .
          # Install testing dependencies
          pip install pytest pytest-cov

      - name: Run tests
        env:
          JAX_PLATFORMS: cpu
        run: |
          pytest tests/ --cov=underPINN --cov-report=xml

      # The data-parallel tests need >1 device, and XLA_FLAGS only takes effect
      # in a fresh process, so they skip inside the run above. This step runs
      # them for real on 8 virtual CPU devices. UNDERPINN_REQUIRE_MULTI_DEVICE
      # makes a misconfigured run (flag ignored -> 1 device) fail instead of
      # passing green on skips. Verifies gradient equivalence, not speedup.
      - name: Run data-parallel tests (8 virtual devices)
        env:
          JAX_PLATFORMS: cpu
          XLA_FLAGS: --xla_force_host_platform_device_count=8
          UNDERPINN_REQUIRE_MULTI_DEVICE: "1"
        run: |
          # test_rba_state.py also covers RBA state with padded (uneven) batches
          pytest tests/test_parallel.py tests/test_rba_state.py -v

      # Trains every example with training.data_parallel off and on and requires
      # identical loss trajectories (and real sharding). Slow and independent of
      # the Python version, so it runs once rather than across the whole matrix.
      - name: Run every example with data parallelism on/off (8 virtual devices)
        if: matrix.python-version == '3.11'
        env:
          JAX_PLATFORMS: cpu
          XLA_FLAGS: --xla_force_host_platform_device_count=8
          UNDERPINN_REQUIRE_MULTI_DEVICE: "1"
        run: |
          pytest tests/test_parallel_examples.py -v
