problem: fno1d_dirichlet

network:
  type              : fno1d
  modes1            : 12
  width             : 32
  depth             : 4
  channels_last_proj: 128
  padding           : 8        # non-periodic domain: FNO zero-pad/trim trick

physics:
  nu_lo: 0.005
  nu_hi: 0.05

data:
  Nx            : 64
  Nt            : 200
  T             : 1.0
  Lx            : 2.0     # domain is x in [-1, 1]
  n_train       : 400
  n_test        : 80
  prev_steps    : 1
  pred_steps    : 1
  pairs_per_traj: 5
  early_frac    : 0.8
  seed          : 0

loss:
  pde_weight       : 0.1
  pde_warmup_epochs: 50
  rba              : false

training:
  epochs            : 500
  lr                : 1.0e-3
  lr_alpha          : 0.01
  batch_size        : 32
  log_every         : 50
  seed              : 0
  save_restart_every: 0

output:
  dir        : outputs/fno1d_dirichlet
  save_params: true
