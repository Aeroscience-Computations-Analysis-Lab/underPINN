problem: airfoil
network:
  type: gated_mlp
  layers:
  - 2
  - 128
  - 128
  - 128
  - 128
  - 3
physics:
  Re: 100.0
  aoa: 0.0
  naca: '0012'
  chord: 1.0
domain:
  xmin: -2.5
  xmax: 8.0
  ymin: -2.5
  ymax: 2.5
data:
  n_fixed_uniform: 40000
  n_fixed_sdf: 20000
  n_dynamic: 10000
  sdf_scale: 0.02
  n_body_bc: 5000
  n_farfield_bc: 1600
  n_sym_bc: 400
  wake_xmin: 1.5
  wake_xmax: 4.0
  wake_ymin: -0.6
  wake_ymax: 0.6
  wake_sigma: 0.15
training:
  epochs: 80000
  lr: 0.001
  lr_alpha: 0.02
  batch_r: 2048
  batch_bc: 512
  log_every: 500
  seed: 0
  save_restart_every: 500
  resample_period: 500
  resample_candidates: 5
  resample_k: 1.0
loss:
  w_body: 40.0
  w_ff: 4.0
  w_pref: 1.0
  w_sym: 5.0
output:
  dir: outputs/airfoil
  save_params: true
