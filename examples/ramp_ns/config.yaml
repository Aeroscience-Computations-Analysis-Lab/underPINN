problem: ramp_ns
# 2-D compressible Navier–Stokes — Mach-3 viscous compression ramp (SBLI).
#
# Supersonic M∞ = 3 flow over a flat bottom wall then a compression ramp.
# Walls are NO-SLIP and ISOTHERMAL at the total (stagnation) temperature
# T0 = 1 + ½(γ−1)M² = 2.8 (for M=3, γ=1.4).  Re = 1e4, Pr = 0.72.
#
#   python examples/ramp_ns/ramp_ns.py
#   python -m underPINN run examples/ramp_ns/config.yaml

network:
  type  : mlp
  layers: [2, 128, 128, 128, 128, 4]   # (x, y) → (f_ρ, f_u, f_v, f_T)

physics:
  gamma    : 1.4
  M_inf    : 3.0      # freestream Mach number
  Re       : 10000.0  # Reynolds number  ρ∞U∞L/μ∞
  Pr       : 0.72     # Prandtl number
  theta_deg: 15.0     # ramp (compression) angle
  mu_law   : constant # 'constant' (μ*=1) or 'sutherland'
  art_visc : 0.002    # artificial viscosity ε on −ε∇²U (shock capturing; 0 = off).
                      # At Re=1e4 the shock is near-inviscid → a small ε removes
                      # Gibbs oscillations and stabilises the compression shock.
  av_sensor: ducros   # 'ducros' = shock-LOCALISED (off in the boundary layer, so
                      #            density gradients there stay sharp) or 'global'.
                      # Set art_visc: 0 to rely purely on the physical 1/Re shock.

geometry:
  L         : 2.0     # domain length
  H         : 1.0     # domain height
  ramp_start: 0.8     # flat bottom wall on [0, ramp_start]; ramp after it
  slip_end  : 0.15    # slip wall (v=0 only) on [0, slip_end]; no-slip after it
                      # — removes the inlet/no-slip leading-edge corner conflict

data:
  # Hybrid interior collocation = UNIFORM base + wall-clustered BL pool +
  # residual-ADAPTIVE pool.  Uniform keeps global coverage; the wall-clustered
  # pool guarantees boundary-layer resolution; the adaptive pool is RAR-resampled
  # toward the high-residual shock / SBLI region.
  n_uniform : 8000    # fixed uniform random interior points
  n_bl      : 8000    # wall-clustered points (boundary-layer resolution)
  bl_beta   : 4.0     # BL clustering strength (higher ⇒ tighter to the wall)
  n_adapt   : 6000    # adaptive (RAR-migrated) interior points → shock
  n_inlet   : 400
  n_wall    : 600     # no-slip region points
  n_slip    : 200     # slip region points
  n_upper   : 300

training:
  epochs            : 300000
  lr                : 1.0e-3
  lr_alpha          : 0.01
  batch_r           : 2048   # PDE batch, split across the three interior pools
  batch_bc          : 256
  adapt_frac        : 0.4    # batch fraction from the adaptive (shock) pool
  bl_frac           : 0.3    # batch fraction from the wall-clustered (BL) pool
  log_every         : 500
  seed              : 0
  save_restart_every: 1000
  rar_period        : 4000   # refresh the ADAPTIVE pool every N epochs (0 = off)
  rar_candidates    : 5
  rar_k             : 1.0
  rar_c             : 1.0
  rar_x_min         : 0.25   # exclude x < rar_x_min from RAR candidates — the
                             # inlet/wall corner (x≈0) is a geometric BC
                             # singularity with far larger raw residual than
                             # the shock, so without this RAR's whole budget
                             # gets pulled onto the corner instead (confirmed
                             # empirically: measured residual there ~15-30x
                             # anything found elsewhere in the domain)

loss:
  w_pde  : 1.0
  w_inlet: 100.0   # supersonic inflow fixes all freestream variables
  w_wall : 100.0   # no-slip (u=v=0) + isothermal (T=T0)
  w_slip : 80.0    # slip region — no-penetration (v=0) only
  w_upper: 20.0    # freestream farfield

output:
  dir: outputs/ramp_ns
