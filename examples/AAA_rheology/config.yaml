# ── Steady Carreau (shear-thinning) flow through an axisymmetric AAA ─────────
#
#   python examples/AAA_rheology/AAA_rheology.py
#   python -m underPINN run examples/AAA_rheology/config.yaml
#
# Same domain and Reynolds number as the NEWTONIAN AAA case
# (examples/AAA/config.yaml):  x ∈ [-3.5, 3.5], R_vessel = 0.5, R_AAA = 1.0,
# x0 = -2.0, L_AAA = 1.5, Re = 40, V_max = 2.0.
# Only the constitutive law changes — Carreau shear-thinning viscosity:
#   μ*(γ̇) = 1 + (β − 1)[1 + (Cu γ̇)²]^((n−1)/2)
#   β = μ0/μ∞ = 16,  n = 0.3568   (blood, Nagargoje et al. 2021, Table II)
# β = 1 recovers the Newtonian case exactly.
# ─────────────────────────────────────────────────────────────────────────────

problem: AAA_rheology

network:
  type  : gated_mlp                          # 'mlp' or 'gated_mlp'
  layers: [3, 192, 192, 192, 192, 192, 4]    # (x, y, z) → (u, v, w, p)

physics:
  # Domain + Re — identical to the Newtonian AAA case
  Re      : 40.0     # Reynolds number (based on μ∞)
  R_vessel: 0.5      # straight-vessel radius
  R_AAA   : 1.0      # peak bulge radius
  L       : 7.0      # total domain length  (x_lo to x_lo + L)
  x_lo    : -3.5     # inlet x-coordinate → pipe spans x ∈ [-3.5, 3.5]
  x0      : -2.0     # axial centre of the bulge
  L_AAA   : 1.5      # full axial width of the bulge region
  V_max   : 2.0      # inlet centreline velocity (matches Newtonian V_max)
  # Carreau rheology (Nagargoje, Mishra & Gupta 2021, Table II — blood):
  #   λ = 3.131 s, n = 0.3568, μ0/μ∞ = 16
  # Non-dim groups in this sim are diameter/mean-velocity based:
  #   D = 2·R_vessel = 1.0,  U_mean = V_max/2 = 1.0  (parabolic)
  #   Re = ρ U_mean D / μ∞ = 40
  #   Cu = λ U_mean / D = 3.131
  beta    : 16.0     # viscosity ratio μ0/μ∞   (1 = Newtonian)
  Cu      : 3.131    # = λ·U_mean/D
  n       : 0.3568   # power-law index

data:
  n_interior: 400000
  n_wall    : 20000
  n_inlet   : 2000
  n_outlet  : 2000

training:
  epochs            : 120000
  lr                : 1.0e-3
  lr_alpha          : 0.01
  batch_r           : 2048
  batch_bc          : 1024
  log_every         : 2000
  seed              : 0
  save_restart_every: 2000

loss:
  w_pde   : 1.0
  w_wall  : 100.0
  w_inlet : 50.0
  w_outlet: 20.0

output:
  dir: outputs/AAA_rheology
