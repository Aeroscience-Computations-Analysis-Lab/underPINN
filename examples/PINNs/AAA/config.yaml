problem: AAA_flow

network:
  type  : gated_mlp                      # 'mlp' or 'gated_mlp'
  layers: [3, 192, 192, 192, 192, 192, 4]    # (x,y,z) → (u,v,w,p)

physics:
  Re         : 40.0
  R_vessel   : 0.5      # straight-vessel radius
  R_AAA : 1.0      # peak bulge radius
  L          : 7.0      # total domain length  (x_lo to x_lo + L)
  x_lo       : -3.5     # inlet x-coordinate → pipe spans x ∈ [-3.5, 3.5]
  x0         : -2.0      # axial centre of the bulge
  L_AAA : 1.5      # full axial width of the bulge region
  V_max      : 2.0      # parabolic inflow peak  u(r) = V_max·(1 − r²/R_vessel²)

data:
  n_interior : 400000
  n_wall     : 20000
  n_inlet    : 2000
  n_outlet   : 2000

training:
  epochs             : 120000
  lr                 : 1.0e-3
  lr_alpha           : 0.01
  batch_r            : 2048
  batch_bc           : 1024
  log_every          : 2000
  seed               : 0
  save_restart_every : 2000    # 0 = off

loss:
  w_pde    : 1.0
  w_wall   : 100.0
  w_inlet  : 50.0
  w_outlet : 20.0

output:
  dir: outputs/AAA_flow
