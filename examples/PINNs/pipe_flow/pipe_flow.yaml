problem: pipe_flow

network:
  type  : gated_mlp                     # 'mlp' or 'gated_mlp'
  layers: [3, 192, 192, 192, 192, 4]   # (x,y,z) → (u,v,w,p)

physics:
  Re   : 40.0
  R    : 0.5      # radius — diameter = 2R = 1.0
  L    : 7.0      # total length  (x_lo to x_lo + L)
  x_lo : -3.5     # inlet x-coordinate → pipe spans x ∈ [-3.5, 3.5]
  U_max: 2.0      # parabolic inflow peak velocity  u(r) = U_max·(1 − r²/R²)

data:
  n_interior: 100000
  n_wall    : 15000
  n_inlet   : 2000
  n_outlet  : 2000

training:
  epochs              : 70000
  lr                  : 1.0e-3
  lr_alpha            : 0.01
  batch_r             : 2048
  batch_bc            : 1024
  log_every           : 500
  seed                : 0
  save_restart_every  : 500   # save restart snapshot every N epochs (0 = off)

loss:
  w_pde   : 1.0
  w_wall  : 100.0
  w_inlet : 50.0
  w_outlet: 20.0

output:
  dir: outputs/pipe_flow
